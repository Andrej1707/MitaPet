<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MitaDesktopPet</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="pet-shell" aria-label="MitaDesktopPet">
      <button id="pet-hitbox" type="button" aria-label="MitaPet">
        <span id="pet-sprite" aria-hidden="true"></span>
      </button>
      <section id="pet-menu" hidden>
        <header>
          <strong id="pet-name">MitaPet</strong>
          <small id="pet-description">Desktop pet</small>
        </header>
        <div class="mode-grid">
          <button data-mode="idle" type="button">Idle</button>
          <button data-mode="walk" type="button">Walk</button>
          <button data-mode="sleep" type="button">Sleep</button>
          <button data-mode="excited" type="button">Excited</button>
        </div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
